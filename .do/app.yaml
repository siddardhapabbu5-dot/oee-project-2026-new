# DigitalOcean App Platform — Nakshatra OEE (Bangalore)
# Docs: https://docs.digitalocean.com/products/app-platform/reference/app-spec/

name: nakshatra-oee
region: blr

services:
  - name: web
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /health
      initial_delay_seconds: 60
      period_seconds: 30
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: JWT_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: SESSION_TIMEOUT_MINUTES
        value: "480"
      - key: LOG_LEVEL
        value: info
      - key: CORS_ORIGIN
        scope: RUN_TIME
        value: ${_self.PUBLIC_URL}

databases:
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: nakshatra-oee-db
