services:
  postgres:
    image: postgres:16-alpine
    container_name: pms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pms
      POSTGRES_PASSWORD: pms_secret
      POSTGRES_DB: production_management
    ports:
      - "5432:5432"
    volumes:
      - pms_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pms -d production_management"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pms_pg_data:
