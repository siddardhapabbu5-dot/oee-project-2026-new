server:
  port: 8081
  servlet:
    context-path: /

spring:
  application:
    name: pms-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/production_management
    username: pms
    password: pms_secret
  jpa:
    hibernate:
      # Keep existing Prisma schema — do not recreate tables
      ddl-auto: validate
      naming:
        # Prisma columns are camelCase (isActive), not snake_case
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # Prisma created camelCase columns ("isActive") — must be quoted in PostgreSQL
        globally_quoted_identifiers: true
    show-sql: false

app:
  jwt:
    # Must match backend/.env JWT_SECRET if sharing tokens with Node, or set your own
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-min-32-chars!!}
    expiration-ms: ${JWT_EXPIRATION_MS:28800000} # 8 hours
  cors:
    allowed-origins: ${CORS_ORIGIN:http://localhost:5176}

logging:
  level:
    com.nakshatra.pms: INFO
    org.springframework.security: INFO
